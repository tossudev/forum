<!DOCTYPE html>

<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="/web/static/css/style.css">
		<link rel="icon" type="image/x-icon" href="/web/static/img/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/web/static/img/mascot/logo-m.png" />
		<meta name="apple-mobile-web-app-title" content="Literary Lions" />

		{{ block "js" . }}{{ end }}
		<title>Literary Lions</title>
	</head>

	<body>
		<header>
			<a href="/">
				<img src="/web/static/img/logo.png" alt="Logo">
			</a>
			<div class="topnav">
				<a class="active" href="/">Home</a>
				<a href="/profile">Profile</a>
				{{ if .Username }}
					<form class="logout-form" action="/users/logout" method="POST">
						<button type="submit">Logout</button>
					</form>
				{{ else }}
					<a href="/users/login">Login</a>
				{{ end }}
			</div>

		</header>

	{{ template "content" . }}	

	</body>
</html>

<!-- TODO: make actual js script -->
<script>
  document.querySelectorAll(".listing").forEach(row => {
	row.addEventListener("click", () => {
	  window.location.href = row.dataset.href;
	});

	row.addEventListener("keydown", event => {
	  if (event.key === "Enter" || event.key === " ") {
		event.preventDefault();
		row.click();
	  }
	});

	row.tabIndex = 0;
  });
</script>
