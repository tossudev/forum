<!DOCTYPE html>

{{ define "content" }}

<div class="contents">
	<p>{{.Path}}</p>

	<p class="thread-container" data-href="/threads/{{.Thread.ID}}">
		<div class="thread-header">
			{{.Thread.Title}}
		</div>

		<div class="comment">
			<div class="left">
				<img class="avatar" src="/web/static/img/default-avatar.png" alt="Avatar">
			</div>

			<div class="right">
				{{.Thread.Body}}
			</div>
		</div>

		{{ range .Comments }}
		<div class="comment">
			<div class="left">
				<img class="avatar" src="/web/static/img/default-avatar.png" alt="Avatar">
			</div>

			<div class="right">
				{{.Comment.Body}}
			</div>
		</div>
		{{ end }}
	</p>
</div>

{{ end }}
