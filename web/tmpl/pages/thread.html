<!DOCTYPE html>

{{ define "js" }}
<script src="/web/static/js/like.js" defer></script>
{{ end }}

{{ define "content" }}

<div class="contents">
	<p>{{.Path}}</p>

	<p class="thread-container" data-href="/threads/{{.Thread.ID}}">
		<div class="comment-container">
			<div class="comment">
				<div class="user-sidebar">
					<img class="user-avatar" src="/web/static/img/default-avatar.png" alt="Avatar">
					<div class="username">{{.AuthorName}}</div>
					<!-- TODO: add role -->
					<div class="role">Member</div> 
				</div>

				<div class="content">
					<div class="thread-header">
						{{.Thread.Title}}
					</div>
					{{.Thread.Body}}
					<div class="thread-footer">
						<div class="date">{{.Thread.DateCreated}}</div>
					</div>
				</div>
			</div>
		</div>

		{{ range .Comments }}
		<div class="comment-container">
			<div class="comment">
				<div class="user-sidebar">
					<img class="user-avatar" src="/web/static/img/default-avatar.png" alt="Avatar">
					<div class="username">{{.AuthorName}}</div>
					<!-- TODO: add role -->
					<div class="role">Member</div> 
				</div>

				<div class="content">
					{{.Body}}
					<div class="thread-footer">
						<button data-comment-id="{{.ID}}" data-action="like"
							{{ if .LoggedUserLiked }}
							class="reaction-btn pressed"
							{{ else }}
							class="reaction-btn"
							{{ end }}
							onclick="likeComment(this, true)">
							<span name="{{.LoggedUserLiked}}" class="likes-{{.ID}}">{{.NumLikes}}</span>
							<span>👍</span>
						</button>
						<button data-comment-id="{{.ID}}" data-action="dislike"
							{{ if .LoggedUserDisliked }}
							class="reaction-btn pressed"
							{{ else }}
							class="reaction-btn"
							{{ end }}
							onclick="likeComment(this, false)">
							<span name="{{.LoggedUserDisliked}}" class="dislikes-{{.ID}}">{{.NumDislikes}}</span>
							<span>👎</span>
						</button>
						<div class="date">{{.DateCreated}}</div>
					</div>
				</div>
			</div>
		</div>
		{{ end }}
	</p>

	{{ if .Username }}
	<div class="center-content">
		<h2>Reply to thread</h2>
		<form class="create-thread" action="/threads/{{ .Thread.ID }}/comments" method="post">
			<label for="body">Body text</label>
			<textarea id="body" name="body" placeholder="Write your comment..." minlength="1" maxlength="5000" required></textarea>
			<p class="error-msg"></p>

			<button class="button register-btn" type="submit">Publish comment</button>
		</form>
	</div>
	{{ end }}
</div>

{{ end }}
