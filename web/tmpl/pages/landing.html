<!DOCTYPE html>

{{ define "content" }}

<div class="search">
	<form class="search" action="/search" method="GET" role="search">
	<input type="search" name="search" placeholder="Search thread or comment...">
	<button class="search" type="submit">Search</button>
	</form>
</div>

<div class="contents">
	<p>
	{{ range $key, $value := .Path }}
	<a class="breadcrumbs" href="{{ $value }}">> {{ $key }}</a>
	{{ end }}
	</p>

	<table class="listing-container">
		<tr class="listing-header">
			<th>Category</th>
			<th>Threads</th>
		</tr>
		
		{{range .Categories}}
		<tr class="listing" data-href="/categories/{{.ID}}">
			<td>{{.Name}}</td>
			<td>{{.ThreadCount}}</td>
		</tr>
		{{end}}
	</table>
</div>

{{ end }}
