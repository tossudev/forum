{{ define "content" }}
<div class="center-content">
    <h2>Create new thread</h2>
    <form class="create-thread" action="/threads" method="post">
        <p class="error-msg other-error">{{ .OtherErr }}</p>

        <label for="category">Category: ~category name~</label>
        <input type="hidden" id="category" name="categoryID" value="{{ .CategoryID }}" />

        <label for="title">Title</label>
        <input type="text" id="title" name="title" maxlength="100" value="{{ .InputTitle }}" required />
        <p class="error-msg other-error">{{ .TitleErr }}</p>

        <label for="body">Body text</label>
        <textarea id="body" name="body" placeholder="Write your post..." minlength="1" maxlength="5000" required>{{ .InputBody }}</textarea>
        <p class="error-msg other-error">{{ .BodyErr }}</p>

        <button class="button register-btn" type="submit">Publish thread</button>
    </form>
</div>
{{ end }}
