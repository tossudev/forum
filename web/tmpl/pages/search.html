<!DOCTYPE html>

{{ define "content" }}

<div class="search">
	<form class="search" action="/search" method="GET">
	<input type="search" name="search" placeholder="Search thread or comment...">
	<button class="search" type="submit">Search</button>
	<p class="response-msg search-error">{{ .ResponseMsg }}</p>
	</form>
</div>

<div class="contents">

	{{if .Threads}}
	<p>{{.ThreadPath}}</p>
	
	<p class="thread-container">
	{{range .Threads}}
		<div class="comment-container">
			<div class="comment">
				<div class="clickable">
				<a href="/threads/{{.ID}}" class="hidden-link"></a>

					<div class="content">
						<div class="thread-header">
							{{.Title}}
						</div>
						{{.Body}}
						<div class="thread-footer">
							<div>{{.DateCreated}}</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	{{ end }}
	</p>
	{{ else }}

	{{ end }}

	{{if .Comments}}
	<p>{{.CommentPath}}</p>
	<p class="thread-container">
		{{ range .Comments }}
		<div class="comment-container">
			<div class="comment">
				<div class="clickable">
				<a href="/threads/{{.ThreadID}}" class="hidden-link"></a>

					<div class="content">
						{{.Body}}
						<div class="thread-footer">
							<div>{{.DateCreated}}</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		{{ end }}
	</p>
	{{ else }}

	{{ end }}

</div>

{{ end }}
