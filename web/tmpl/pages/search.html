<!DOCTYPE html>

{{ define "content" }}

<div class="contents">
	<p>{{.ThreadPath}}</p>
	
	<p class="thread-container">
	{{range .Threads}}
		<div class="comment-container">
			<div class="comment">
				<div class="clickable">
				<a href="/threads/{{.ID}}" class="hidden-link"></a>

					<div class="content">
						<div class="thread-header">
							{{.Title}}
						</div>
						{{.Body}}
						<div class="thread-footer">
							<div>{{.DateCreated}}</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	{{ end }}
	</p>

	<p>{{.CommentPath}}</p>
	<p class="thread-container">
		{{ range .Comments }}
		<div class="comment-container">
			<div class="comment">
				<div class="clickable">
				<a href="/threads/{{.ThreadID}}" class="hidden-link"></a>

					<div class="content">
						{{.Body}}
						<div class="thread-footer">
							<div>{{.DateCreated}}</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		{{ end }}
	</p>

</div>

{{ end }}
