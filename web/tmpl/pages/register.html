{{ define "js" }}
<script src="/web/static/js/register.js" defer></script>
{{ end }}

{{ define "content" }}
<div class="center-content">
    <h2>Create an account</h2>
    <form class="register" action="/users/register" method="post">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" minlength="2" maxlength="20" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="8" maxlength="128" required />

        <button class="button register-btn" type="submit">Register</button>

        <p class="error-msg"></p>
    </form>
</div>
{{ end }}
