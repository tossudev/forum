{{ define "js" }}
<script src="/web/static/js/passwordToggle.js" defer></script>
{{ end }}

{{ define "content" }}
<div class="center-content">
    <h2>Create an account</h2>
    <form class="register" action="/users/register" method="post">
        <p class="error-msg other-error">{{ index .FieldErrors "OtherErr" }}</p>
        
        <label for="username">Username</label>
        <input type="text" id="username" name="username" minlength="2" maxlength="20" value="{{ .InputUsername }}" required />
        <p class="error-msg username-error">{{ index .FieldErrors "UsernameErr" }}</p>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ .InputEmail }}" minlength="6" maxlength="254" required />
        <p class="error-msg email-error">{{ index .FieldErrors "EmailErr" }}</p>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="8" maxlength="128" required />

        <div class="hor-flex-wrapper">
            <label for="pw-visibility-toggle">Show Password</label>
            <input type="checkbox" id="pw-visibility-toggle" onclick="showPassword()" />
        </div>

        <p class="error-msg password-error">{{ index .FieldErrors "PasswordErr" }}</p>

        <button class="button register-btn" type="submit">Register</button>
    </form>
</div>
{{ end }}
