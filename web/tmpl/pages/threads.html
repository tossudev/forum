<!DOCTYPE html>

{{ define "content" }}

<div class="contents">
	<div class="hor-flex-wrapper">
		<p>{{.Path}}</p>
		<a class="button create-thread" href="/categories/{{.CategoryID}}/create">+ Create thread</a>
	</div>

	<table class="listing-container">
		<tr class="listing-header">
			<th>Topic</th>
			<th>Replies</th>
			<th>Created</th>
		</tr>
		
		{{range .Threads}}
		<tr class="listing" data-href="/threads/{{.ID}}">
			<td>{{.Title}}</td>
			<td>{{.ReplyCount}}</td>
			<td>{{.DateCreated}}</td>
		</tr>
		{{end}}
	</table>
	
	<div class="pagination">
		Pages:
		{{ range .PageList }}
			<a href="/categories/{{ $.CategoryID }}?page={{ . }}">{{ . }} </a>
		{{ end }}

		{{ if le .NextPage .TotalPages }}
			<a href="/categories/{{ .CategoryID }}?page={{ .NextPage }}">Next></a>
		{{ end }}

		{{ if lt .Page .TotalPages }}
			<a href="/categories/{{ .CategoryID }}?page={{ .TotalPages }}">Last >></a>
		{{ end }}
	</div>
</div>

{{ end }}
