<!DOCTYPE html>

{{ define "content" }}

<div class="contents">
	<div class="hor-flex-wrapper">
		<p>
		{{ range $key, $value := .Path }}
		<a class="breadcrumbs" href="{{ $value }}">> {{ $key }}</a>
		{{ end }}
		</p>
		<a class="button create-thread" href="/categories/{{.CategoryID}}/create">+ Create thread</a>
	</div>

	<table class="listing-container">
		<tr class="listing-header">
			<th>Topic</th>
			<th>Replies</th>
			<th>Created</th>
		</tr>
		
		{{range .Threads}}
		<tr class="listing" data-href="/threads/{{.ID}}">
			<td>{{.Title}}</td>
			<td>{{.ReplyCount}}</td>
			<td>{{.DateCreated}}</td>
		</tr>
		{{end}}
	</table>
</div>

{{ end }}
