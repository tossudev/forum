<!DOCTYPE html>

{{ define "content" }}

<div class="contents">
	<p>{{.Path}}</p>

	<table class="listing-container">
		<tr class="listing-header">
			<th>Topic</th>
			<th>Replies</th>
			<th>Created</th>
		</tr>
		
		{{range .Threads}}
		<tr class="listing" data-href="/threads/{{.ID}}">
			<td>{{.Title}}</td>
			<td>{{.ReplyCount}}</td>
			<td>{{.DateCreated}}</td>
		</tr>
		{{end}}
	</table>
</div>

{{ end }}
