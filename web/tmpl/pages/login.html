{{ define "js" }}
<!-- <script src="/web/static/js/login.js" defer></script> -->
{{ end }}

{{ define "content" }}
<div class="center-content">
    <h2>Login</h2>
    <form class="login" action="/users/login" method="post">
        <p class="error-msg other-error">{{ index .FieldErrors "OtherErr" }}</p>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ .Email }}" minlength="6" maxlength="254" required />
        <p class="error-msg email-error">{{ index .FieldErrors "EmailErr" }}</p>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="8" maxlength="128" required />
        <p class="error-msg password-error">{{ index .FieldErrors "PasswordErr" }}</p>

        <input class="button login-btn" type="submit" value="Login" />

        <p>No account? <a href="/users/register">Sign up</a></p>
    </form>
</div>
{{ end }}
