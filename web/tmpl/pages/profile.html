{{ define "content" }}
<div class="center-content">
	<h2>Profile</h2>
	<div class="profile-view">
		<div class="left">
			<img class="avatar" src="/web/static/img/default-avatar.png" alt="Avatar">
		</div>

		
		<div class="right">
			<h2>{{.Username}}</h2>
			<p class="role">{{.Role}}</p>
			<p>Registered since {{.DateCreated}}</p>
		</div>
	</div>

	<div>
		<a href="/profile/threads">Threads</a>
		<a href="/profile/comments">Comments</a>
		<a href="/profile/liked-threads">Liked Threads</a>
		<a href="/profile/disliked-threads">Disliked Threads</a>
	</div>
</div>
{{ end }}
