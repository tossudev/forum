{{ define "content" }}
<div class="center-content">
	<h2>Profile</h2>
	<div class="profile-view">
		<form method="POST" action="/profile/avatar" enctype="multipart/form-data" class="left">
			<img class="avatar"
			{{ if .Avatar }}
			src="/uploads/{{ .Avatar }}"
			{{ else }}
			src="/web/static/img/default-avatar.png"
			{{ end }}
			alt="Avatar">
			{{ if .Username }}
			<input type="file" id="imageUpload" name="image"
			accept="image/jpeg, image/jpg, image/png, image/gif">
			<input type="submit">
			{{ end }}
		</form>

		
		<div class="right">
			<h2>{{ .ProfileUsername }}</h2>
			<p class="role">{{ .Role }}</p>
			<p>Registered since {{ .DateCreated }}</p>
		</div>
	</div>

	{{ template "profile-links" . }}
</div>
{{ end }}
