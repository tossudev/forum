{{ define "content" }}
<div class="center-content">
	<h2>Profile</h2>
	<div class="profile-view">
		<div class="left">
			<img class="avatar" src="/web/static/img/default-avatar.png" alt="Avatar">
		</div>

		
		<div class="right">
			<h2>{{ .ProfileUsername }}</h2>
			<p class="role">{{ .Role }}</p>
			<p>Registered since {{ .DateCreated }}</p>
		</div>
	</div>

	{{ template "profile-links" . }}
</div>
{{ end }}
